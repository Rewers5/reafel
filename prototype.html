<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>reafel · prototype</title>
<meta name="description" content="Executable prototype of reafel, a review tool for cardiologists diagnosing atrial fibrillation from 72 h ECG, activity and patient notes. Student concept, DTU 02810. Not a medical device. All data is synthetic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f3f3f1; --surface:#fff; --ink:#111; --ink-2:#55554f; --mute:#9a9a94;
    --line:#dadad5; --line-soft:#ebebe7; --accent:#f04e2a; --accent-soft:#fce1da; --accent-ink:#c93a1b;
    --a-rest:#e4e4e0; --a-walk:#bdbdb7; --a-active:#7c7c76; --a-sleep:#33332f;
    --paper-grid:#f7c9bd; --paper-grid-minor:#fbe4dd;
    --display:'Outfit',sans-serif; --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  body{min-width:1180px}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  ::selection{background:var(--accent-soft)}
  .label{font:500 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .mono{font:400 11px/1.4 var(--mono)}
  .h1{font:600 44px/1.1 var(--display);letter-spacing:-.02em}
  .h2{font:600 24px/1.2 var(--display);letter-spacing:-.01em}
  .h3{font:600 15px/1.33 var(--sans)}
  .num{font:600 32px/1 var(--display);letter-spacing:-.01em}
  .display{font:600 72px/.95 var(--display);letter-spacing:-.04em}
  .small{font-size:11px;line-height:1.45;color:var(--mute)}
  .muted{color:var(--mute)} .ink2{color:var(--ink-2)} .acc{color:var(--accent)}

  /* top bar */
  .top{height:56px;display:flex;align-items:center;gap:40px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
  .logo{font:600 22px/1 var(--display);letter-spacing:-.03em}
  .tabs{display:flex;gap:28px}
  .tab{display:flex;align-items:center;gap:8px;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 0}
  .tab i{width:6px;height:6px;background:var(--line);display:block}
  .tab.on{color:var(--ink)} .tab.on i{background:var(--accent)}
  .tab:hover{color:var(--ink)}
  .who{margin-left:auto;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

  /* layout */
  .screen{display:flex;min-height:calc(100vh - 56px)}
  .main{flex:1;padding:28px 32px 48px;min-width:0}
  .side{width:380px;flex:0 0 380px;border-left:1px solid var(--ink);padding:24px 24px 48px;background:var(--paper)}
  .side.wide{width:460px;flex-basis:460px}
  .crumb{font:500 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

  /* primitives */
  .btn{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:transform .08s, background .15s}
  .btn:active{transform:translateY(1px)}
  .btn.accent{background:var(--accent);border-color:var(--accent)}
  .btn.accent:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:#fff}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn svg{width:12px;height:12px}
  .tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--ink);font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .tag.fill{background:var(--ink);color:#fff}
  .tag.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .tag.grey{background:var(--line-soft);border-color:var(--line-soft);color:var(--ink-2)}
  .tag.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
  .chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--ink);background:#fff;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff}
  .chip:hover:not(.on){background:var(--line-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .box{background:#fff;border:1px solid var(--ink)}
  .box.soft{border-color:var(--line)}
  .card{background:#fff;border:1px solid var(--line);padding:14px 16px}
  .field{width:100%;background:#fff;border:1px solid var(--line);padding:10px 12px;font:400 13px/1.5 var(--sans);resize:vertical;min-height:44px}
  .field:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .field.flat{background:var(--line-soft);border-color:transparent}
  .field.flat:focus{background:#fff}
  .cb{width:16px;height:16px;border:1.5px solid var(--ink);background:#fff;display:inline-grid;place-items:center;flex:0 0 16px;cursor:pointer}
  .cb.on{background:var(--ink)}
  .cb svg{width:10px;height:10px;display:none} .cb.on svg{display:block}
  .toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;font:500 11px/1.3 var(--mono);letter-spacing:.04em;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:560px;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .hl{outline:2px solid var(--accent) !important;outline-offset:3px;animation:pulse 1.2s 3}
  @keyframes pulse{50%{outline-color:transparent}}
  kbd{font:400 10px/1 var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 5px;background:#fff}

  /* 01 patients */
  .pt-left{width:388px;flex:0 0 388px;padding:28px 32px 48px;border-right:1px solid var(--ink)}
  .search{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--ink);background:#fff;padding:0 14px;margin:20px 0 22px}
  .search input{flex:1;border:0;outline:0;background:none;font-size:14px}
  .search svg{width:16px;height:16px}
  .cal{border-top:1px solid var(--line)}
  .cal-row{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .cal-row .t{font:400 11px/1 var(--mono);width:34px;color:var(--ink-2)}
  .cal-row .n{font:500 14px/1.3 var(--sans)} .cal-row .s{font-size:11px;color:var(--mute)}
  .cal-row.done{opacity:.55} .cal-row.done .t,.cal-row.done .n{color:var(--mute)}
  .cal-row.next{background:var(--accent);color:#fff;padding:18px 16px;margin:0 -16px;border:0;transition:background .1s}
  .cal-row.next .t,.cal-row.next .s{color:#fff;opacity:.9}
  .cal-row.next:active{background:var(--accent-ink)}
  .cal-row.next .arrow{margin-left:auto;width:14px}
  .tbl{width:100%;border-collapse:collapse;margin-top:18px;table-layout:fixed}
  .tbl col.c1{width:16%}.tbl col.c2{width:11%}.tbl col.c3{width:20%}.tbl col.c4{width:17%}.tbl col.c5{width:9%}.tbl col.c6{width:11%}.tbl col.c7{width:16%}
  .tbl th{text-align:left;font:500 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:0 10px 10px;cursor:pointer;user-select:none;white-space:nowrap}
  .tbl th:hover{color:var(--ink)} .tbl th.on{color:var(--ink)}
  .tbl td{padding:14px 10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl tr.row{cursor:pointer} .tbl tr.row:hover td{background:#fff}
  .tbl tr.cur td{background:#fff;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .tbl tr.cur td:first-child{border-left:1px solid var(--ink)} .tbl tr.cur td:last-child{border-right:1px solid var(--ink)}
  .tbl .nm{font:500 14px/1.3 var(--sans)} .tbl .sub{font-size:11px;color:var(--mute)}
  .bar{display:inline-block;width:72px;height:4px;background:var(--line);vertical-align:middle;margin-right:10px;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .go{width:30px;height:30px;background:var(--accent);display:inline-grid;place-items:center;color:#fff;margin-left:12px}
  .go:hover{background:var(--accent-ink)} .go svg{width:12px;height:12px}
  .empty{padding:48px 0;text-align:center;color:var(--ink-2)}

  /* 02 review */
  .stats{display:flex;gap:36px;margin-left:auto;align-self:flex-end}
  .stat .label{margin-bottom:6px}
  .stat .num{display:inline}
  .stat .u{font-size:11px;color:var(--ink-2);margin-left:4px}
  .ov{margin-top:18px;background:#fff;border:1px solid var(--ink);padding:12px 16px 10px;position:relative}
  .ov-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .legend{display:flex;gap:14px;margin-left:auto}
  .legend span{display:flex;align-items:center;gap:5px;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .legend i{width:8px;height:8px;display:block} .legend i.ring{border-radius:50%;border:1.5px solid var(--ink);width:7px;height:7px} .legend i.dot{border-radius:50%;background:var(--ink)}
  canvas{display:block}
  #ov{width:100%;height:230px;cursor:grab} #ov.drag{cursor:grabbing}
  .ecg{margin-top:16px;background:#fff;border:1px solid var(--ink);padding:12px 16px 14px}
  .ecg-h{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .ecg-h .z{margin-left:auto;display:flex;gap:4px}
  .strip{position:relative;height:96px;margin-top:8px;border:1px solid var(--line-soft);user-select:none}
  .strip canvas{width:100%;height:100%;cursor:crosshair}
  .strip .st{position:absolute;left:4px;bottom:2px;font:400 10px/1 var(--mono);color:var(--ink-2);background:rgba(255,255,255,.8);padding:2px 3px;pointer-events:none}
  .mark{position:absolute;top:0;bottom:0;background:rgba(17,17,17,.12);border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);pointer-events:none}
  .mark b{position:absolute;left:-1.5px;top:-1px;transform:translateY(-100%);background:var(--ink);color:#fff;font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;white-space:nowrap}
  .mark.new{background:rgba(240,78,42,.14);border-color:var(--accent)} .mark.new b{background:var(--accent)}
  .onset{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);pointer-events:none}
  .onset b{position:absolute;left:-1px;top:0;background:var(--accent);color:#fff;font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;white-space:nowrap}
  .pop{position:absolute;z-index:30;width:340px;background:#fff;border:1px solid var(--ink);box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px}
  .pop .label{color:var(--ink);margin-bottom:10px}
  .evl{margin:8px 0 0}
  .ev{display:flex;gap:14px;padding:12px 0 12px 0;border-bottom:1px solid var(--line);cursor:pointer;position:relative;align-items:flex-start}
  .ev:hover{background:#fff}
  .ev.on{background:#fff;border-left:3px solid var(--accent);margin-left:-24px;padding-left:21px;margin-right:-24px;padding-right:24px}
  .ev .dot{width:7px;height:7px;border-radius:50%;background:var(--mute);margin-top:6px;flex:0 0 7px}
  .ev .dot.af{background:var(--accent)} .ev .dot.ring{background:#fff;border:1.5px solid var(--ink);width:8px;height:8px}
  .ev .tm{width:68px;flex:0 0 68px} .ev .tm b{font:500 11px/1.4 var(--mono)} .ev .tm span{display:block;font:400 11px/1.4 var(--mono);color:var(--mute)}
  .ev .tx{flex:1;min-width:0} .ev .tx b{font:500 14px/1.3 var(--sans);display:block} .ev .tx span{font-size:11px;color:var(--mute)}
  .ev .tag{margin-top:4px}
  .quote{background:var(--line-soft);padding:12px 14px;display:flex;gap:10px;margin-top:12px}
  .quote svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}
  .quote b{font-weight:500;display:block} .quote span{font-size:11px;color:var(--mute)}
  .ext{display:inline-flex;align-items:center;gap:6px;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .ext i{width:6px;height:6px;border:1px solid var(--mute);transform:rotate(45deg)}

  /* 03 summary */
  .grid{display:grid;grid-template-columns:52px repeat(24,1fr);gap:3px;align-items:center;margin-top:12px}
  .grid .d{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .cell{height:26px;background:#fff;border:1px solid var(--line-soft)}
  .cell.off{background:var(--line-soft);border-color:var(--line-soft)}
  .cell.af{background:var(--accent);color:#fff;font:500 11px/26px var(--mono);text-align:center;cursor:pointer;border-color:var(--accent)}
  .cell.af:hover{background:var(--accent-ink)}
  .cell.sus{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);font:500 11px/26px var(--mono);text-align:center;cursor:pointer}
  .hbar{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-top:12px}
  .hbar .label{color:var(--ink)}
  .hb{height:8px;background:var(--line);position:relative;margin:2px 0}
  .hb i{position:absolute;left:0;top:0;bottom:0;background:var(--mute)} .hb.af i{background:var(--accent)}
  .hb span{position:absolute;left:calc(var(--w) + 8px);top:-4px;font:400 11px/1.4 var(--mono);color:var(--ink-2);white-space:nowrap}
  .sym{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .sym svg{width:14px;height:14px;flex:0 0 14px}
  .sym b{display:block;font:500 14px/1.3 var(--sans)} .sym span{font-size:11px;color:var(--mute)}
  .sym .tag{margin-left:auto}
  .jf{margin-top:18px}
  .jf .label{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .jf .field{min-height:70px}
  .sel{width:100%;display:flex;align-items:center;background:#fff;border:1px solid var(--line);padding:0 12px;height:44px;font-size:14px;cursor:pointer;position:relative}
  .sel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .sel .code{margin-left:auto;font:400 11px/1 var(--mono);color:var(--ink-2)}
  .sel.empty{color:var(--mute)}
  .note{background:var(--accent-soft);color:var(--accent-ink);padding:10px 14px;margin-top:14px;font-size:12px;display:flex;gap:10px;align-items:center}
  .note button{text-decoration:underline;color:inherit;font-weight:500}

  /* 04 consult */
  .ovp{background:#fff;border:1px solid var(--ink);padding:14px 16px 16px;margin-top:18px}
  .ovp-h{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .kpi .num{font-size:30px} .kpi span{display:block;font-size:11px;color:var(--ink-2);margin-top:6px}
  .tl{position:relative;height:40px;margin-top:16px;background:#fff;border:1px solid var(--line-soft)}
  .tl .night{position:absolute;top:0;bottom:0;background:var(--line-soft)}
  .tl .ep{position:absolute;top:0;bottom:0;background:var(--accent);min-width:3px}
  .tl-d{display:flex;justify-content:space-between;margin-top:6px}
  .mat{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  .mcard{background:#fff;border:1px solid var(--ink);padding:14px 14px 12px;transition:opacity .2s}
  .mcard.off{opacity:.45}
  .mcard .h{display:flex;align-items:center;gap:10px;font:500 14px/1.3 var(--sans);cursor:pointer}
  .mcard canvas{width:100%;height:90px;margin:12px 0 10px;display:block}
  .q{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .q p{margin:0;font-size:14px;line-height:1.4}
  .q .tag{margin-top:8px}
  .q.off p{color:var(--mute);text-decoration:line-through}
  .addq{display:flex;gap:12px;align-items:center;padding:14px 0;color:var(--mute);cursor:text}
  .addq input{flex:1;border:0;background:none;outline:0;font-size:14px}
  .addq input:focus{color:var(--ink)}
  .dx{background:var(--line-soft);padding:12px 14px;margin-top:18px}
  .dx b{display:block;font:400 14px/1.4 var(--sans);margin-top:4px}
  .pv{position:fixed;inset:0;background:var(--paper);z-index:60;overflow:auto;display:none}
  .pv.show{display:block}
  .pv .in{max-width:1080px;margin:0 auto;padding:56px 40px}
  .pv .close{position:fixed;top:20px;right:24px}
  .pv .kpis .num{font-size:56px}
  .pv .mat{margin-top:40px}

  /* prototype bar + annotations */
  .pbar{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;gap:6px}
  .pbar .btn{height:32px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .drawer{position:fixed;top:56px;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--ink);z-index:35;transform:translateX(100%);transition:transform .22s;overflow:auto;padding:22px 22px 90px}
  .drawer.show{transform:none}
  .drawer h4{margin:0;font:600 20px/1.2 var(--display);letter-spacing:-.01em}
  .an{border:1px solid var(--line);padding:12px 14px;margin-top:12px}
  .an .k{display:flex;align-items:center;gap:10px;font:500 14px/1.3 var(--sans)}
  .an .k i{width:22px;height:22px;background:var(--ink);color:#fff;display:grid;place-items:center;font:500 10px/1 var(--mono)}
  .an .k.x i{background:#fff;color:var(--ink);border:1px solid var(--ink)}
  .an dl{margin:10px 0 0;display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:12px;line-height:1.45}
  .an dt{font:500 9px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)} .an dd{margin:0;color:var(--ink-2)}
  .an .show{margin-top:10px;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:underline}
  .dc{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .dc label{display:flex;gap:10px;align-items:center;font-size:12px;cursor:pointer}
  .dc .btn{justify-content:center}

  @media print{.top,.pbar,.drawer,.side,.toast{display:none !important}.pv{position:static;display:block}body{min-width:0}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">reafel.</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who">Dr. A. Holm — Cardiology outpatient</div>
</header>
<div id="app"></div>

<div class="pv" id="pv"></div>
<div class="toast" id="toast"></div>

<div class="pbar">
  <button class="btn ghost" id="b-anno" title="Microinteraction annotations for this screen">Annotations</button>
  <button class="btn" id="b-demo">Prototype controls</button>
</div>
<aside class="drawer" id="drawer"></aside>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-arrow" viewBox="0 0 12 12"><path d="M1 6h9M6.5 2.5 10 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 10 10"><path d="M1.5 5.5 4 8l4.5-6" fill="none" stroke="#fff" stroke-width="1.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-quote" viewBox="0 0 14 14"><path d="M2 2h10v7H6l-3 3V9H2z" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
</svg>

<script>
/* =========================================================
   reafel prototype · synthetic data + state
   ========================================================= */
const T0 = new Date(2026, 9, 1, 10, 0, 0);          // Thu 1 Oct 2026 10:00 · recording start
const H = 72;                                       // hours recorded
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CLASSES = ['AF','Flutter','Ectopic','Sinus','Artefact'];
const ACT_COL = {sleep:'#33332f', rest:'#e4e4e0', walk:'#bdbdb7', active:'#7c7c76'};
const ACT_NAME = {sleep:'Sleep', rest:'Rest', walk:'Walk', active:'Active'};
const ACT_VERB = {sleep:'sleeping', rest:'resting', walk:'walking', active:'physically active'};

function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

/* =========================================================

   ========================================================= */
function rhythmAt(h){ const e = S.events.find(e => h >= e.h && h < e.h + Math.max(e.dur, .4)/3600);
  if (!e) return 'sinus'; if (e.auto === 'AF') return 'af'; if (e.auto === 'Pause') return 'pause'; if (e.auto === 'Ectopic') return 'ectopic'; if (e.auto === 'Sinus tachy') return 'tachy'; return 'sinus'; }

    else if (m === 'tachy') { rr = .5 + (r()-.5)*.03; }
    else if (m === 'pause') { rr = out.length % 6 === 3 ? 2.2 : .9; }
    else if (m === 'ectopic') { if (out.length % 5 === 2) { rr = .5; type = 'pvc'; } else rr = .9 + (r()-.5)*.03; }
    else { rr = .86 + (r()-.5)*.05; }
    t += rr; out.push({t, type}); }

}
const g = (x, c, w, a) => a * Math.exp(-((x-c)*(x-c)) / (2*w*w));
function ecgValue(t, bs, mode){ let v = 0;
  for (const b of bs) { const x = t - b.t; if (x < -.3 || x > .5) continue;
    if (b.type === 'pvc') { v += g(x,0,.03,-.9) + g(x,.07,.05,.7) + g(x,.3,.08,-.35); continue; }
    if (b.type !== 'af') v += g(x,-.17,.025,.12);
    v += g(x,-.03,.01,-.08) + g(x,0,.011,1) + g(x,.03,.012,-.22) + g(x,.26,.05,.28); }
  if (mode === 'af') v += .04*Math.sin(t*2*Math.PI*6.2) + .025*Math.sin(t*2*Math.PI*9.1);
  return v; }
function drawECG(cv, t0h, durS, forceMode){
  const dpr = window.devicePixelRatio || 1; const W = cv.clientWidth, Hh = cv.clientHeight; cv.width = W*dpr; cv.height = Hh*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr); c.fillStyle = '#fff'; c.fillRect(0,0,W,Hh);
  const pxmm = W / (durS*25); // 25 mm/s
  c.lineWidth = 1; c.strokeStyle = '#fbe4dd'; c.beginPath(); for (let x = 0; x < W; x += pxmm) { c.moveTo(x,0); c.lineTo(x,Hh); } for (let y = Hh; y > 0; y -= pxmm) { c.moveTo(0,y); c.lineTo(W,y); } c.stroke();
  c.strokeStyle = '#f7c9bd'; c.beginPath(); for (let x = 0; x < W; x += pxmm*5) { c.moveTo(x,0); c.lineTo(x,Hh); } for (let y = Hh; y > 0; y -= pxmm*5) { c.moveTo(0,y); c.lineTo(W,y); } c.stroke();
  const bs = beats(t0h, durS, forceMode); const mode = forceMode || rhythmAt(t0h + 1/3600);

}

function drawStrips(){

    s.querySelectorAll('.onset,.mark').forEach(x => x.remove());

      if (e.user) { const el = document.createElement('div'); el.className = 'mark'; el.style.left = rel/d*100+'%'; el.style.width = Math.max(.5, e.dur/d*100)+'%'; el.innerHTML = `<b>Your mark · ${esc(e.cls)}${e.note?' · '+esc(e.note):''}</b>`; s.appendChild(el); }

}

    s.onmouseup = ev => { if (sx == null) return; const x = ev.clientX - s.getBoundingClientRect().left; const a = Math.min(sx,x), b = Math.max(sx,x); const len = px2s(b-a); sx = null;

function confirmEvent(){ const e = S.events[S.sel]; if (!e) return; if (!S.draftCls) { $('#cls').classList.add('shake'); setTimeout(() => $('#cls').classList.remove('shake'), 400); toast('Choose a class first · the automatic label is only a suggestion'); return; }

  $('#j-find').oninput = e => { J.findings = e.target.value; if (!J.findingsEdited) { J.findingsEdited = true; const t = $('#f-tag'); t.textContent = 'Edited by you'; t.classList.remove('grey'); } };
  $('#j-dx').onchange = e => { J.dx = e.target.value || null; render(); };
  document.querySelectorAll('[data-cell]').forEach(c => c.onclick = () => { const [d, hh] = c.dataset.cell.split('|'); const e = afEvents().find(e => { const x = hDate(e.h); return DAYS[x.getDay()] + ' ' + x.getDate() === d && x.getHours() === +hh; }); openEvent(evIndex(e)); go('review'); });
  document.querySelectorAll('[data-goev]').forEach(c => c.onclick = () => { openEvent(+c.dataset.goev); go('review'); });
  $('#j-save').onclick = () => { const b = $('#j-save'); b.disabled = true; b.textContent = 'Saving…'; J.err = null;
    setTimeout(() => { if (S.journalOffline) { J.err = 'The journal system did not answer. Your draft is kept here · try again.'; } else { J.saved = '10:02'; } render(); if (!J.err) toast('Written to the hospital journal · 10:02'); }, 900); };
  $('#j-prep').onclick = () => go('consult');
}

/* =========================================================
   screen 04 · consult
   ========================================================= */
function rConsult(){
  const af = afEvents(); const tot = Math.round(afMinutes()); const lon = af.length ? Math.round(Math.max(...af.map(e=>e.dur))/60) : 0;
  const act = af.filter(e => ['walk','active'].includes(actAt(e.h))).length; const match = S.ptNotes.filter(n => af.some(e => Math.abs(e.h-n.h)*60 <= 10)).length;
  const fromRev = S.questions.filter(q => q.src).length; const J = S.journal;
  const night = ACT.filter(s => s[2]==='sleep');
  return `<div class="screen">
    <div class="main">
      <div class="crumb">004 / Prepare patient talk</div>
      <div class="display">consultation.</div>
      <div class="ink2" style="margin-top:8px">John Doe · today 10:15 · room 3</div>
      <div class="ovp">
        <div class="ovp-h"><span class="label" style="color:var(--ink)">Overview for the patient · plain language</span><div class="legend"><span><i style="background:#f04e2a"></i>Episode of uneven heartbeat</span><span><i style="background:#ebebe7"></i>Night</span></div></div>
        <div class="kpis">
          <div class="kpi"><div class="num">${af.length}</div><span>episode${af.length===1?'':'s'} in three days</span></div>
          <div class="kpi"><div class="num">${tot} min</div><span>in total, longest ${lon} min</span></div>
          <div class="kpi"><div class="num">${act} of ${af.length}</div><span>while walking or working</span></div>
          <div class="kpi"><div class="num">${match} of ${S.ptNotes.length}</div><span>of your notes match an episode</span></div>
        </div>
        <div class="tl">${night.map(s => `<div class="night" style="left:${s[0]/H*100}%;width:${(s[1]-s[0])/H*100}%"></div>`).join('')}${af.map(e => `<div class="ep" style="left:${e.h/H*100}%;width:${e.dur/3600/H*100}%" title="${fDay(e.h)} ${fHM(e.h)} · ${fDur(e.dur)}"></div>`).join('')}</div>
        <div class="tl-d">${[[0,'Thu'],[14,'Fri'],[38,'Sat'],[62,'Sun']].map(([h,d]) => `<span class="label" style="color:var(--ink);position:relative;left:0">${d}</span>`).join('')}</div>
      </div>
      <div class="label" style="margin-top:22px;color:var(--ink)">Material to show · ticked items appear in the patient view</div>
      <div class="mat" data-anno="04A">${S.material.map(m => `<div class="mcard ${m.on?'':'off'}" data-mat="${m.id}"><div class="h"><span class="cb ${m.on?'on':''}">${ico('i-check')}</span>${m.title} · ${fDay(m.at)} ${fHM(m.at)}</div><canvas data-ecg="${m.mode}" data-at="${m.at}"></canvas><div class="ink2">${m.text}</div></div>`).join('')}</div>
    </div>
    <div class="side">
      <div style="display:flex;align-items:baseline"><span class="h2">questions.</span><span class="label" style="margin-left:auto">${fromRev} from review · ${S.questions.length-fromRev} added</span></div>
      <div id="ql" style="margin-top:4px">${S.questions.map((q,i) => `<div class="q ${q.on?'':'off'}" data-q="${i}"><span class="cb ${q.on?'on':''}">${ico('i-check')}</span><div><p>${esc(q.text)}</p>${q.src ? `<span class="tag grey">${esc(q.src)}</span>` : ''}</div></div>`).join('')}</div>
      <div class="addq" data-anno="04B"><span style="font-size:16px;line-height:1">+</span><input id="addq" placeholder="Add question"></div>
      <div class="dx"><div class="label">Tentative diagnosis</div><b>${J.dx ? esc(DX.find(d=>d.code===J.dx).name) + ' · ' + J.dx : '<span class="muted">Not chosen yet · set it on 03 Summary</span>'}</b></div>
      <div style="display:flex;gap:8px;margin-top:18px"><button class="btn" id="pv-open" data-anno="04C">Open patient view ${ico('i-arrow')}</button><button class="btn ghost" id="print" title="Later release · button only">Print summary</button></div>
      <div class="ext" style="margin-top:14px"><i></i>External · second screen or turned towards the patient</div>
    </div>
  </div>`;
}
function bindConsult(){
  document.querySelectorAll('canvas[data-ecg]').forEach(cv => drawECG(cv, +cv.dataset.at, 10, cv.dataset.ecg));
  document.querySelectorAll('[data-mat] .h').forEach(h => h.onclick = () => { const m = S.material.find(m => m.id === h.parentElement.dataset.mat); if (m.on && S.material.filter(x => x.on).length === 1) { h.parentElement.classList.add('shake'); setTimeout(() => h.parentElement.classList.remove('shake'), 400); toast('At least one item must stay ticked'); return; } m.on = !m.on; render(); });
  document.querySelectorAll('[data-q]').forEach(q => q.onclick = () => { const x = S.questions[+q.dataset.q]; x.on = !x.on; render(); });
  const inp = $('#addq'); inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) { S.questions.push({text:inp.value.trim(), src:null, on:true}); render(); $('#addq').focus(); } };
  $('#pv-open').onclick = openPatientView;
  $('#print').onclick = () => { toast('Print summary is a later release · opening the browser print dialog as a stand-in'); setTimeout(() => window.print(), 600); };
}
function openPatientView(){
  const af = afEvents(); const tot = Math.round(afMinutes()); const lon = af.length ? Math.round(Math.max(...af.map(e=>e.dur))/60) : 0;
  const act = af.filter(e => ['walk','active'].includes(actAt(e.h))).length; const match = S.ptNotes.filter(n => af.some(e => Math.abs(e.h-n.h)*60 <= 10)).length;
  const pv = $('#pv'); pv.innerHTML = `<button class="btn ghost close" id="pv-close">Close · Esc</button><div class="in">
    <div class="logo">reafel.</div>
    <div class="h1" style="margin-top:40px">Your heart over three days, John.</div>
    <p style="font-size:18px;line-height:1.5;color:var(--ink-2);max-width:620px">We recorded your heartbeat from Thursday to Sunday. Most of the time it was steady. A few times it became fast and uneven. Here is what we found.</p>
    <div class="kpis" style="margin-top:40px">
      <div class="kpi"><div class="num">${af.length}</div><span>episode${af.length===1?'':'s'} of uneven heartbeat</span></div>
      <div class="kpi"><div class="num">${tot} min</div><span>in total, longest ${lon} min</span></div>
      <div class="kpi"><div class="num">${act} of ${af.length}</div><span>while walking or working</span></div>
      <div class="kpi"><div class="num">${match} of ${S.ptNotes.length}</div><span>of your notes matched an episode</span></div>
    </div>
    <div class="tl" style="height:56px;margin-top:40px">${ACT.filter(s=>s[2]==='sleep').map(s => `<div class="night" style="left:${s[0]/H*100}%;width:${(s[1]-s[0])/H*100}%"></div>`).join('')}${af.map(e => `<div class="ep" style="left:${e.h/H*100}%;width:${e.dur/3600/H*100}%"></div>`).join('')}</div>
    <div class="tl-d">${['Thu','Fri','Sat','Sun'].map(d => `<span class="label" style="color:var(--ink)">${d}</span>`).join('')}</div>
    <div class="mat">${S.material.filter(m => m.on).map(m => `<div class="mcard"><div class="h">${m.title}</div><canvas data-ecg="${m.mode}" data-at="${m.at}" style="height:120px"></canvas><div class="ink2" style="font-size:15px">${m.text}</div></div>`).join('')}</div>
    <div class="small" style="margin-top:48px">Patient view · shows only the plain-language overview and the ticked material. No journal text, no other patients.</div></div>`;
  pv.classList.add('show'); pv.querySelectorAll('canvas[data-ecg]').forEach(cv => drawECG(cv, +cv.dataset.at, 10, cv.dataset.ecg));
  $('#pv-close').onclick = () => pv.classList.remove('show');
}

/* =========================================================
   annotations + prototype controls
   ========================================================= */
const ANNO = {
  patients: {title:'01 Locate patient', items:[
    {k:'A', id:'01A', t:'Search by CPR', trig:'Typing in the search field, or ⌘K / Ctrl+K from anywhere.', rule:'Matches name or CPR digits from the first character. The last four CPR digits stay masked in the list.', fb:'Table filters while typing and the count under the title updates. No match shows “No patient found, check the CPR no.”'},
    {k:'B', id:'01B', t:'Open next appointment', trig:'Click the orange appointment block or the arrow on the selected row.', rule:'Opens the review at the first unreviewed event, not at the start of the recording.', fb:'Block darkens on press. Review opens with that event selected in the list and on the timeline.'},
    {k:'C', id:'01C', t:'Sort a column', trig:'Click a column header.', rule:'First click sorts ascending, second descending. One sort at a time. Default is consultation time.', fb:'Arrow appears on the active header and rows reorder in place.'}]},
  review: {title:'02 Review and classify · 02b Create event', items:[
    {k:'A', id:'02A', t:'Move the window', trig:'Drag the outlined window on the 72 h overview, or click anywhere on it.', rule:'All lanes share one time axis. On release the window snaps to an event if one is within 2 minutes.', fb:'ECG strips redraw while dragging. The time in the ECG header follows the window.'},
    {k:'B', id:'02B', t:'Classify an event', trig:'Click a class tag, or press 1–5. Then “Confirm and next” or Enter.', rule:'One class per event. The automatic label is only a suggestion until confirmed.', fb:'Chosen tag fills. On confirm the row tag changes, “Reviewed” goes up by one and the next unreviewed event opens.'},
    {k:'C', id:'02C', t:'Ask patient', trig:'Click “Ask patient” on an event.', rule:'Creates a question linked to this event. Does not block confirming the event.', fb:'Button changes to “Added to questions”. The question shows up on screen 04 with the tag “From event 06”.'},
    {k:'A', id:'02bA', t:'Create an event by dragging', trig:'Press and drag across an ECG strip.', rule:'Minimum length 0.5 s. Esc cancels.', fb:'Shaded range with a live duration label while dragging. The popover opens on release.'},
    {k:'B', id:'02bB', t:'Save the new event', trig:'“Save event” or Enter in the popover.', rule:'A class is required, the note is optional.', fb:'Popover closes. A ring marker appears in the “Your notes” lane and a new row is added to the event list.'},
    {k:'C', id:'02bC', x:true, t:'External · patient note arrives', trig:'The patient saves a note in the phone app (outside this tool). Use “Simulate patient note” in the prototype controls.', rule:'Notes are placed by their timestamp and never edited by the HCP.', fb:'A black dot appears in the “Patient notes” lane and the nearest event shows the quote.'}]},
  summary: {title:'03 Summarise and diagnose', items:[
    {k:'A', id:'03A', t:'Open an hour', trig:'Click a coloured cell in the hour grid.', rule:'Only cells with AF minutes are clickable. Grey cells were not recorded.', fb:'Goes to the review screen with the window placed on that hour.'},
    {k:'B', id:'03B', t:'Edit drafted findings', trig:'Click into “Objective findings”.', rule:'The draft is built from confirmed events only. Once edited it is never overwritten.', fb:'Tag changes from “Drafted from data · edit” to “Edited by you”.'},
    {k:'C', id:'03C', x:true, t:'External · save to journal', trig:'Click “Save to journal”.', rule:'Disabled until a diagnosis is chosen and all AF-suspect events are reviewed. Writes to the hospital journal system.', fb:'Button shows “Saved 10:02”. If the journal system does not answer (toggle in prototype controls), the draft is kept and an error is shown next to the button.'}]},
  consult: {title:'04 Prepare patient talk', items:[
    {k:'A', id:'04A', t:'Choose material', trig:'Tick or untick a material card.', rule:'At least one item must stay ticked.', fb:'Unticked cards fade. The patient view shows only ticked items.'},
    {k:'B', id:'04B', t:'Add a question', trig:'Click “Add question”, type, press Enter.', rule:'Questions from the review keep a link back to their event.', fb:'New row appears at the end of the list and the counter in the header updates.'},
    {k:'C', id:'04C', x:true, t:'External · open patient view', trig:'Click “Open patient view”.', rule:'Shows only plain-language overview and ticked material. Journal text and other patients are never shown.', fb:'A full-screen view opens, ready to turn towards the patient or send to a second screen.'}]},
};
function rDrawer(){
  const d = $('#drawer'); if (!S.annoOpen && !S.demoOpen) { d.classList.remove('show'); return; } d.classList.add('show');
  if (S.annoOpen) { const a = ANNO[S.screen]; d.innerHTML = `<div class="label">Microinteractions</div><h4>${a.title}</h4><p class="small" style="margin:8px 0 0">Trigger · rules · feedback, as annotated in the Figma storyboard. “Show me” highlights the element on screen.</p>
    ${a.items.map(i => `<div class="an"><div class="k ${i.x?'x':''}"><i>${i.k}</i>${i.t}</div><dl><dt>Trigger</dt><dd>${i.trig}</dd><dt>Rules</dt><dd>${i.rule}</dd><dt>Feedback</dt><dd>${i.fb}</dd></dl><button class="show" data-hl="${i.id}">Show me</button></div>`).join('')}`;
    d.querySelectorAll('[data-hl]').forEach(b => b.onclick = () => { const el = document.querySelector(`[data-anno="${b.dataset.hl}"]`); if (!el) { toast('This element is not on screen right now'); return; } el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 3600); }); }
  else { const rev = S.events.filter(e => e.reviewed).length; d.innerHTML = `<div class="label">Prototype</div><h4>Controls for testing</h4><p class="small" style="margin:8px 0 0">Everything here is synthetic data for John Doe. Nothing is sent anywhere. Not a medical device.</p>
    <div class="dc">
      <div class="small">State · ${rev} of ${S.events.length} events reviewed · ${S.questions.length} questions · journal ${S.journal.saved ? 'saved' : 'draft'}</div>
      <button class="btn ghost" id="d-ff">Fast-forward · review remaining events with the auto label</button>
      <button class="btn ghost" id="d-note">Simulate a patient note arriving (external)</button>
      <label><span class="cb ${S.journalOffline?'on':''}" id="d-off">${ico('i-check')}</span>Simulate the journal system being offline</label>
      <button class="btn" id="d-reset">Reset prototype</button>
      <div class="small" style="margin-top:8px">Keyboard · ⌘K search · 1–5 classify · Enter confirm · Esc cancel · Ctrl+Enter confirm from the note field</div>
      <div class="small">Scenario · Dr A. Holm, cardiology outpatient, Monday 5 Oct 2026, 10:00. Next consultation John Doe 10:15.</div>
    </div>`;
    $('#d-ff').onclick = () => { S.events.forEach(e => { if (!e.reviewed) { e.reviewed = true; e.cls = e.auto === 'AF' ? 'AF' : e.auto === 'Ectopic' ? 'Ectopic' : 'Sinus'; e.note = e.note || 'Agreed with the automatic label.'; } }); if (S.screen === 'review') openEvent(S.sel); render(); toast('All events reviewed with their automatic label'); };
    $('#d-note').onclick = () => { if (S.noteArrived) { toast('Already arrived · reset to replay'); return; } S.noteArrived = true; S.ptNotes.push({h:49.12, text:'Short of breath on the way up the hill.', short:'Breathless'}); render(); toast('Patient note arrived · Sat 11:07 “Short of breath on the way up the hill.”'); };
    $('#d-off').onclick = () => { S.journalOffline = !S.journalOffline; rDrawer(); };
    $('#d-reset').onclick = () => { S = initialState(); location.hash = '#/patients'; render(); toast('Prototype reset'); }; }
}

/* =========================================================
   render + global events
   ========================================================= */
function render(){
  const T = [['patients','01 Patients'],['review','02 Review'],['summary','03 Summary'],['consult','04 Consult']];
  $('#tabs').innerHTML = T.map(([k,t]) => `<button class="tab ${S.screen===k?'on':''}" data-go="${k}"><i></i>${t}</button>`).join('');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const app = $('#app');
  if (S.screen === 'patients') { app.innerHTML = rPatients(); rPatientTable(); bindPatients(); }
  else if (S.screen === 'review') { app.innerHTML = rReview(); bindReview(); }
  else if (S.screen === 'summary') { app.innerHTML = rSummary(); bindSummary(); }
  else { app.innerHTML = rConsult(); bindConsult(); }
  rDrawer();
}
function bindPatients(){
  const q = $('#q'); q.oninput = () => { S.search = q.value; rPatientTable(); bindTable(); };
  bindTable();
}
function bindTable(){
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { S.filter = b.dataset.filter; rPatientTable(); bindTable(); });
  document.querySelectorAll('[data-sort]').forEach(h => h.onclick = () => { const k = h.dataset.sort; S.sort = S.sort.key === k ? {key:k, dir:-S.sort.dir} : {key:k, dir:1}; rPatientTable(); bindTable(); });
  document.querySelectorAll('[data-open]').forEach(r => r.onclick = ev => { ev.stopPropagation(); const p = PATIENTS.find(p => p.id === r.dataset.open);
    if (!p.loaded) { S.selPt = p.id; rPatientTable(); bindTable(); toast(`Prototype · only John Doe's recording is loaded. ${p.name} would open the same way.`); return; }
    const i = S.events.findIndex(e => !e.reviewed); openEvent(i >= 0 ? i : 0); go('review'); });
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.screen !== 'patients') go('patients'); $('#q').focus(); return; }
  if (e.key === 'Escape') { if ($('#pv').classList.contains('show')) $('#pv').classList.remove('show'); const p = $('.pop'); if (p) { p.remove(); document.querySelectorAll('.mark.new').forEach(m => m.remove()); } if (typing) e.target.blur(); return; }
  if (S.screen !== 'review' || $('.pop')) return;
  if (!typing && /^[1-5]$/.test(e.key)) { S.draftCls = CLASSES[+e.key - 1]; document.querySelectorAll('[data-cls]').forEach(x => x.classList.toggle('on', x.dataset.cls === S.draftCls)); }
  if (!typing && e.key === 'Enter') confirmEvent();
});
$('#b-anno').onclick = () => { S.annoOpen = !S.annoOpen; S.demoOpen = false; rDrawer(); };
$('#b-demo').onclick = () => { S.demoOpen = !S.demoOpen; S.annoOpen = false; rDrawer(); };
window.addEventListener('hashchange', () => { const s = location.hash.replace('#/',''); if (ANNO[s] && s !== S.screen) { S.screen = s; render(); } });
window.addEventListener('resize', () => { if (S.screen === 'review') { drawOverview(); drawStrips(); } if (S.screen === 'consult') document.querySelectorAll('canvas[data-ecg]').forEach(cv => drawECG(cv, +cv.dataset.at, 10, cv.dataset.ecg)); });
const start = location.hash.replace('#/',''); if (ANNO[start]) S.screen = start;
render();
if (document.fonts) document.fonts.ready.then(render);
</script>
</body>
